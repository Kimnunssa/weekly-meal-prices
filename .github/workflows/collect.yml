# 매일 아침 참가격 · KAMIS 를 조회해 값이 바뀌었을 때만 prices.json 을 커밋한다.
# 키는 저장소 Settings → Secrets and variables → Actions 의 DATA_GO_KR · KAMIS_KEY 에만 둔다.
# 이 파일은 깃허브 저장소 weekly-meal-prices 의 .github/workflows/collect.yml 에 올린다(앱 저장소에는 사본만 둠).
name: collect-prices
on:
  schedule:
    - cron: '0 21 * * *' # 한국 시간 매일 06:00
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collect.mjs
        env:
          DATA_GO_KR: ${{ secrets.DATA_GO_KR }}
          KAMIS_KEY: ${{ secrets.KAMIS_KEY }}
      - name: commit
        run: |
          if git diff --quiet prices.json; then echo "no change"; exit 0; fi
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git commit -m "prices: $(node -p "const p=require('./prices.json'); p.surveyDay + ' · KAMIS ' + (p.kamisDay || '-')")"
          git push
